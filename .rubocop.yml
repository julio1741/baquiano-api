# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable

# Request/system specs legitimately assert on status + body + headers
# together; splitting each into its own example would hurt readability
# more than it helps.
RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Max: 20

# End-to-end lifecycle specs (create → assign role → act as staff → publish)
# legitimately need more than 5 lets to set up a realistic scenario.
RSpec/MultipleMemoizedHelpers:
  Max: 10

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false
