  /api/v1/admin/audit_events:
    get:
      summary: List audit events, optionally filtered by resource and/or action
      description: >
        Capped at 200 rows per request (truncated: true means more exist)
        — there's no cursor/offset pagination yet, only these filters.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: resource_type
          in: query
          schema: { type: string }
        - name: resource_id
          in: query
          schema: { type: string, format: uuid }
        - name: audit_action
          in: query
          description: >
            Named audit_action, not action — action is Rails' own reserved
            controller-action param name.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  truncated: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/reports/orders_by_day:
    get:
      summary: Daily order counts, revenue, and cancellation rate for a date range
      description: Defaults to the last 7 days if period_start/period_end aren't given (section 14's basic operational reports).
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period_start
          in: query
          schema: { type: string, format: date }
        - name: period_end
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, format: date }
                    orders: { type: integer }
                    revenue_amount: { type: integer }
                    cancelled_orders: { type: integer }
                    cancellation_rate: { type: number, format: double, description: Percentage, e.g. 12.5 for 12.5%. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/webhooks/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Receive a webhook event from an external provider
      description: >
        Unauthenticated by design — these come from external providers,
        not our own app users; verified via the X-Webhook-Signature header
        instead of a bearer token. Stored and processed idempotently by
        (provider, provider_event_id). No real provider is wired up yet
        (section 16) — this only receives, verifies, and stores.
      tags: [webhooks]
      parameters:
        - name: X-Webhook-Signature
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Arbitrary provider payload; only "id"/"event_id" and "type" are read.
      responses:
        "200":
          description: Received and enqueued for async processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  id: { type: string, format: uuid }
