        - name: key
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SystemSetting" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Set a system setting
      description: Always inserts a new, incremented version — never updates a row in place (Configuration::SetSetting).
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope_type: { type: string }
                scope_id: { type: string, format: uuid }
                key: { type: string }
                value: { description: Any JSON-serializable value; shape depends on value_type. }
                value_type: { type: string, enum: [string, integer, boolean, json] }
                expires_at: { type: string, format: date-time }
              required: [scope_type, key, value, value_type]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSetting" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableContent" }

