      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference: { type: string, example: "REF001234" }
                amount: { type: integer }
                paid_at: { type: string, format: date-time }
                origin_bank_code: { type: string }
                destination_bank_code: { type: string }
                payer_document_masked: { type: string, example: "V-****5678" }
                payer_phone_masked: { type: string, example: "0414-***4567" }
                evidence_attachment_reference: { type: string }
              required: [reference, amount, paid_at]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobilePaymentSubmission" }
        "404": { description: Not found (also returned for another customer's order) }

