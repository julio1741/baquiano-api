              type: object
              properties:
                reason_code: { type: string, example: out_of_stock }
                notes: { type: string }
              required: [reason_code]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: reason_code is required (error.code reason_code_required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/merchant/orders/{id}/start_preparing:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Mark the order as being prepared
      tags: [merchant]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Invalid transition from the order's current status (error.code invalid_transition) }

  /api/v1/merchant/orders/{id}/mark_ready:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Mark the order ready for pickup
      tags: [merchant]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Invalid transition from the order's current status (error.code invalid_transition) }

  /api/v1/admin/orders:
    get:
      summary: List every order platform-wide, optionally filtered by organization_id or status
      description: Read-only. No admin action can force a status change — see docs/architecture/decisions.md.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: organization_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Order" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Show an order with its full status history
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Order"
                  - type: object
                    properties:
                      status_history:
                        type: array
                        items: { $ref: "#/components/schemas/OrderStatusHistoryEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }
