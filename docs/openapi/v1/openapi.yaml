---
openapi: 3.1.0
info:
  title: Baquiano API
  version: v1
  description: >
    Backend del MVP de Baquiano (pedidos y entregas — Barinas, Venezuela).
    Consumido por las apps de clientes/repartidores, el portal de comercios
    y la consola administrativa.
servers:
  - url: http://localhost:3001
    description: Local development (docker compose)
tags:
  - name: customer
    description: /api/v1/customer
  - name: courier
    description: /api/v1/courier
  - name: merchant
    description: /api/v1/merchant
  - name: admin
    description: /api/v1/admin
  - name: webhooks
    description: /api/v1/webhooks

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Short-lived access token returned by .../otp/verify or .../session/refresh.

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
            request_id: { type: string }
            correlation_id: { type: string }
          required: [code, message]
      required: [error]

    Device:
      type: object
      properties:
        installation_id: { type: string }
        platform: { type: string, enum: [ios, android, web] }
        app_version: { type: string }
        os_version: { type: string }
        device_model: { type: string }
        push_token: { type: string }
        push_provider: { type: string }
        fingerprint: { type: string }
      required: [installation_id, platform]

    OtpChallenge:
      type: object
      properties:
        otp_challenge_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        dev_only_code:
          type: string
          description: Only present outside production, while there is no SMS gateway wired up.

    Session:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string }
        access_token: { type: string }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, nullable: true }
        preferred_language: { type: string }
        timezone: { type: string }
        status: { type: string }
        phone_verified_at: { type: string, format: date-time, nullable: true }

    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        description: { type: string, nullable: true }
        scope_type: { type: string, enum: [platform, organization, branch] }
        organization_id: { type: string, format: uuid, nullable: true }
        system_role: { type: boolean }
        active: { type: boolean }

    Permission:
      type: object
      properties:
        id: { type: string, format: uuid }
        resource: { type: string }
        action: { type: string }
        code: { type: string }
        description: { type: string, nullable: true }
        sensitive: { type: boolean }

    RoleAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid, nullable: true }
        branch_id: { type: string, format: uuid, nullable: true }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        legal_name: { type: string }
        display_name: { type: string }
        organization_type: { type: string, enum: [merchant, platform, fleet_partner] }
        status: { type: string, enum: [pending, active, suspended] }
        default_currency: { type: string, example: VES }
        onboarding_status: { type: string }
        approved_at: { type: string, format: date-time, nullable: true }
        suspended_at: { type: string, format: date-time, nullable: true }
        suspension_reason: { type: string, nullable: true }

    Merchant:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        slug: { type: string }
        description: { type: string, nullable: true }
        vertical: { type: string, enum: [restaurant, grocery, pharmacy] }
        status: { type: string, enum: [pending, active, suspended] }
        accepts_baquiano_couriers: { type: boolean }
        accepts_own_couriers: { type: boolean }

    Branch:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [pending, active, suspended] }
        delivery_model: { type: string, enum: [baquiano, merchant, hybrid] }
        address_text: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        preparation_time_minutes: { type: integer, nullable: true }
        accepts_cash: { type: boolean }
        accepts_mobile_payment: { type: boolean }
        accepts_pos_on_delivery: { type: boolean }
        paused_at: { type: string, format: date-time, nullable: true }
        pause_reason: { type: string, nullable: true }

    CoveredBranch:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        delivery_model: { type: string, enum: [baquiano, merchant, hybrid] }
        preparation_time_minutes: { type: integer, nullable: true }
        accepts_cash: { type: boolean }
        accepts_mobile_payment: { type: boolean }
        accepts_pos_on_delivery: { type: boolean }

    Catalog:
      type: object
      properties:
        id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        version: { type: integer }
        published_at: { type: string, format: date-time, nullable: true }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        parent_category_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        position: { type: integer }
        active: { type: boolean }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        product_type: { type: string }
        base_price_amount: { type: integer, description: Minimum currency unit (e.g. centavos). }
        currency: { type: string, example: VES }
        active: { type: boolean }
        age_restricted: { type: boolean }
        prescription_required: { type: boolean }

    CatalogView:
      type: object
      description: Read-only, customer-facing catalog — only published/active data.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        published_at: { type: string, format: date-time }
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              products:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    sku: { type: string }
                    name: { type: string }
                    description: { type: string, nullable: true }
                    base_price_amount: { type: integer }
                    currency: { type: string }
                    age_restricted: { type: boolean }
                    prescription_required: { type: boolean }

    InventoryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid, nullable: true }
        product_variant_id: { type: string, format: uuid, nullable: true }
        availability_status: { type: string, enum: [available, low_stock, unavailable] }
        quantity: { type: integer, nullable: true }
        track_quantity: { type: boolean }
        unavailable_until: { type: string, format: date-time, nullable: true }

    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string, nullable: true }
        recipient_name: { type: string }
        original_text: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        is_default: { type: boolean }
        covered:
          type: boolean
          description: Whether any service area currently covers this point (informational only).
        archived_at: { type: string, format: date-time, nullable: true }

    CartItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        product_variant_id: { type: string, format: uuid, nullable: true }
        quantity: { type: integer }
        unit_price_amount_snapshot: { type: integer }
        line_total: { type: integer }

    Cart:
      type: object
      properties:
        id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        status: { type: string, enum: [active, converted, abandoned, expired] }
        currency: { type: string }
        expires_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }

    Quote:
      type: object
      description: >
        Every amount is server-computed — section 4.7 of the spec: the
        client never sends a trustworthy total.
      properties:
        id: { type: string, format: uuid }
        currency: { type: string }
        subtotal_amount: { type: integer }
        tax_amount: { type: integer }
        delivery_fee_amount: { type: integer }
        service_fee_amount: { type: integer, description: Always 0 — no service fee configuration exists yet. }
        total_amount: { type: integer }
        expires_at: { type: string, format: date-time }

    Order:
      type: object
      description: >
        current_status only ever changes through Orders::TransitionOrder's
        state machine (section 5 of the spec) — direct writes are rejected
        at the model level.
      properties:
        id: { type: string, format: uuid }
        public_number: { type: string, example: "BQ-20260819-AB12CD" }
        current_status:
          type: string
          enum: [payment_pending, payment_review, placed, merchant_pending, merchant_accepted, merchant_rejected,
                 preparing, ready_for_pickup, courier_search, courier_assigned, courier_at_merchant, picked_up,
                 en_route, courier_at_customer, delivered, cancellation_requested, cancelled, delivery_failed,
                 refund_pending, partially_refunded, refunded, disputed, closed]
        payment_status: { type: string, enum: [pending, not_required, confirmed, refunded] }
        payment_method: { type: string, enum: [mobile_payment, pos_on_delivery, cash] }
        payment_intent_status:
          type: string
          nullable: true
          description: The order's PaymentIntent status, once one exists (see PaymentIntent).
        fulfillment_type: { type: string, enum: [delivery, pickup] }
        delivery_model: { type: string, enum: [baquiano, merchant, hybrid] }
        currency: { type: string }
        total_amount: { type: integer }
        customer_notes: { type: string, nullable: true }
        cancellation_reason_code: { type: string, nullable: true }
        placed_at: { type: string, format: date-time }
        delivery_pin:
          type: string
          nullable: true
          description: >
            Present once a Delivery exists for this order — the customer
            reads this out to the courier to confirm delivery.
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }

    OrderItem:
      type: object
      description: An immutable snapshot of a cart item taken at order-placement time.
      properties:
        id: { type: string, format: uuid }
        name_snapshot: { type: string }
        variant_name_snapshot: { type: string, nullable: true }
        quantity: { type: integer }
        notes: { type: string, nullable: true }

    OrderStatusHistoryEntry:
      type: object
      properties:
        from_status: { type: string }
        to_status: { type: string }
        actor_type: { type: string, enum: [customer, merchant_staff, courier, system] }
        actor_user_id: { type: string, format: uuid, nullable: true }
        reason_code: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }

    Courier:
      type: object
      properties:
        id: { type: string, format: uuid }
        courier_type: { type: string, enum: [baquiano, merchant] }
        status: { type: string, enum: [pending, active, suspended] }
        approval_status: { type: string, enum: [pending, approved, rejected] }
        risk_level: { type: string }
        cash_enabled: { type: boolean }
        approved_at: { type: string, format: date-time, nullable: true }
        suspended_at: { type: string, format: date-time, nullable: true }
        suspension_reason: { type: string, nullable: true }

    Vehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        vehicle_type: { type: string, enum: [motorcycle, bicycle, car, walking, other] }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        color: { type: string, nullable: true }
        active: { type: boolean }

    CourierDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        document_type: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        expires_at: { type: string, format: date-time, nullable: true }
        rejection_reason: { type: string, nullable: true }

    DispatchOffer:
      type: object
      description: >
        score_snapshot is a placeholder MVP scoring policy (nearest online
        courier by their last location ping) — not a validated dispatch
        algorithm, see docs/architecture/decisions.md.
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, rejected, expired, cancelled] }
        offered_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        score_snapshot: { type: object }

    Delivery:
      type: object
      description: >
        status only ever changes through Deliveries::TransitionDelivery,
        which also keeps the parent Order's current_status in lockstep
        (section 5 of the spec's transition matrix).
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending_assignment, offered, assigned, accepted, at_merchant, picked_up, en_route, at_customer,
                 delivered, failed, cancelled]
        pickup_location: { $ref: "#/components/schemas/GeoPoint" }
        dropoff_location: { $ref: "#/components/schemas/GeoPoint" }
        assigned_at: { type: string, format: date-time, nullable: true }
        accepted_at: { type: string, format: date-time, nullable: true }
        arrived_at_merchant_at: { type: string, format: date-time, nullable: true }
        picked_up_at: { type: string, format: date-time, nullable: true }
        arrived_at_customer_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        failed_at: { type: string, format: date-time, nullable: true }
        failure_reason: { type: string, nullable: true }

    GeoPoint:
      type: object
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }

    PaymentIntent:
      type: object
      description: >
        provider is always "manual" — there is no real bank/payment
        gateway integration (section 16 of the spec).
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        payment_method: { type: string, enum: [mobile_payment, pos_on_delivery, cash] }
        status:
          type: string
          enum: [created, pending_customer_action, pending_review, authorized, captured, failed, cancelled,
                 expired, partially_refunded, refunded]
        amount: { type: integer }
        currency: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        failure_code: { type: string, nullable: true }
        failure_message: { type: string, nullable: true }

    MobilePaymentSubmission:
      type: object
      description: >
        Never confirmed automatically — a human always reviews it. A
        reused reference is recorded and flagged review_status=duplicate
        rather than rejected outright.
      properties:
        id: { type: string, format: uuid }
        payment_intent_id: { type: string, format: uuid }
        reference: { type: string }
        amount: { type: integer }
        currency: { type: string }
        paid_at: { type: string, format: date-time }
        review_status: { type: string, enum: [submitted, under_review, confirmed, rejected, duplicate] }
        duplicate_of_submission_id: { type: string, format: uuid, nullable: true }
        rejection_reason: { type: string, nullable: true }

    PosPaymentRecord:
      type: object
      description: Self-confirming — recorded by whoever is present at the terminal, no separate review step.
      properties:
        id: { type: string, format: uuid }
        payment_intent_id: { type: string, format: uuid }
        amount: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [confirmed, reversed] }
        receipt_reference: { type: string, nullable: true }
        confirmed_by_user_id: { type: string, format: uuid }
        confirmed_at: { type: string, format: date-time }

    Refund:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        status: { type: string, enum: [requested, approved, rejected, completed, failed] }
        reason_code: { type: string }
        reason_notes: { type: string, nullable: true }
        amount: { type: integer }
        currency: { type: string }
        requested_by_user_id: { type: string, format: uuid }
        approved_by_user_id: { type: string, format: uuid, nullable: true }
        requested_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        failure_code: { type: string, nullable: true }

    ReconciliationBatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        payment_method: { type: string }
        currency: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        status: { type: string, enum: [open, completed] }
        expected_amount: { type: integer }
        actual_amount: { type: integer }
        difference_amount: { type: integer }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReconciliationItem" }

    ReconciliationItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        external_reference: { type: string, nullable: true }
        expected_amount: { type: integer }
        actual_amount: { type: integer }
        difference_amount: { type: integer }
        status: { type: string, enum: [pending, matched, discrepant, resolved] }
        resolution_code: { type: string, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }

    Settlement:
      type: object
      description: >
        gross/commission computed directly from Order/Delivery data for
        the period, not from the ledger — see docs/architecture/decisions.md
        for what that does and doesn't account for (e.g. later refunds).
      properties:
        id: { type: string, format: uuid }
        beneficiary_type: { type: string, enum: [Merchant, Courier] }
        beneficiary_id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        currency: { type: string }
        gross_amount: { type: integer }
        commission_amount: { type: integer }
        adjustment_amount: { type: integer }
        net_amount: { type: integer }
        status: { type: string, enum: [pending, approved, paid, failed] }
        paid_at: { type: string, format: date-time, nullable: true }

    CashBalance:
      type: object
      properties:
        id: { type: string, format: uuid }
        courier_id: { type: string, format: uuid }
        currency: { type: string }
        amount_held: { type: integer }
        exposure_limit: { type: integer }
        blocked_for_cash_orders: { type: boolean }
        calculated_at: { type: string, format: date-time }

    CashHandover:
      type: object
      properties:
        id: { type: string, format: uuid }
        courier_id: { type: string, format: uuid }
        amount: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [pending, confirmed] }
        handed_over_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time, nullable: true }

    Notification:
      type: object
      description: >
        provider is always "log" (Notifications::LogProvider) — no real
        push/SMS/email integration exists yet (section 16).
        destination_digest, not the raw phone/email/push token, per
        section 4.15: "No incluir datos personales o detalles sensibles
        innecesarios en push notifications."
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid, nullable: true }
        channel: { type: string, enum: [push, sms, email, internal] }
        template_code: { type: string }
        status: { type: string, enum: [pending, sent, delivered, failed] }
        sent_at: { type: string, format: date-time, nullable: true }

    NotificationPreference:
      type: object
      properties:
        id: { type: string, format: uuid }
        notification_type: { type: string }
        push_enabled: { type: boolean }
        sms_enabled: { type: boolean }
        email_enabled: { type: boolean }

    SupportCase:
      type: object
      description: >
        The full admin view. status only ever changes through
        Support::TransitionCase — direct writes are rejected at the model
        level. See SupportCaseSummary for the smaller shape the
        customer/courier endpoints expose.
      properties:
        id: { type: string, format: uuid }
        public_number: { type: string }
        category: { type: string }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status:
          type: string
          enum: [open, in_progress, waiting_customer, waiting_merchant, waiting_courier, resolved, closed]
        subject: { type: string }
        description: { type: string }
        resolution: { type: string, nullable: true }
        opened_by_user_id: { type: string, format: uuid }
        assigned_to_user_id: { type: string, format: uuid, nullable: true }
        order_id: { type: string, format: uuid, nullable: true }
        delivery_id: { type: string, format: uuid, nullable: true }
        opened_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }

    SupportCaseSummary:
      type: object
      description: The subset returned by the customer/courier support case endpoints.
      properties:
        id: { type: string, format: uuid }
        public_number: { type: string }
        category: { type: string }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status:
          type: string
          enum: [open, in_progress, waiting_customer, waiting_merchant, waiting_courier, resolved, closed]
        subject: { type: string }
        resolution: { type: string, nullable: true }
        opened_at: { type: string, format: date-time }

    FraudSignal:
      type: object
      description: Append-only signal log — never updated after creation (section 4.17).
      properties:
        id: { type: string, format: uuid }
        subject_type: { type: string }
        subject_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid, nullable: true }
        payment_intent_id: { type: string, format: uuid, nullable: true }
        signal_type: { type: string }
        score: { type: number, format: double }
        severity: { type: string, enum: [low, medium, high, critical] }
        evidence: { type: object }
        detected_at: { type: string, format: date-time }

    RiskDecision:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject_type: { type: string }
        subject_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid, nullable: true }
        decision:
          type: string
          enum: [allow, challenge, hold, manual_review, restrict_payment_method, reject, suspend]
        risk_score: { type: number, format: double }
        reasons: { type: object }
        rules_version: { type: string }
        reviewed_by_user_id: { type: string, format: uuid, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }

    SystemSetting:
      type: object
      description: >
        Append-only, versioned per (scope_type, scope_id, key) —
        Configuration::SetSetting always inserts a new row with an
        incremented version rather than updating one in place, so history
        is never lost.
      properties:
        id: { type: string, format: uuid }
        scope_type: { type: string }
        scope_id: { type: string, format: uuid, nullable: true }
        key: { type: string }
        value:
          description: The stored value — a string, number, boolean, or object, depending on value_type.
        value_type: { type: string, enum: [string, integer, boolean, json] }
        version: { type: integer }
        effective_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }

    FeatureFlag:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        description: { type: string, nullable: true }
        enabled: { type: boolean }
        rules: { type: object }

    AuditEvent:
      type: object
      description: >
        Append-only (section 4.18: "La auditoría debe ser append-only") —
        no updated_at, and never written directly except through
        Audit::RecordEvent. The underlying table also stores a
        change_details jsonb column (named that instead of the spec's
        literal "changes" — ActiveRecord already defines a `changes`
        instance method and raises DangerousAttributeError at model-load
        time if a column shadows it); GET /admin/audit_events doesn't
        currently return it, only metadata.
      properties:
        id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid, nullable: true }
        actor_type: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string, format: uuid, nullable: true }
        organization_id: { type: string, format: uuid, nullable: true }
        branch_id: { type: string, format: uuid, nullable: true }
        metadata: { type: object }
        occurred_at: { type: string, format: date-time }

    WebhookEvent:
      type: object
      description: >
        Received via POST /api/v1/webhooks/{provider} and processed
        idempotently by (provider, provider_event_id). The raw payload is
        stored encrypted (payload_encrypted) and isn't exposed through any
        API response.
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        provider_event_id: { type: string }
        event_type: { type: string, nullable: true }
        signature_valid: { type: boolean }
        status: { type: string, enum: [received, processed, failed] }
        received_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time, nullable: true }
        attempt_count: { type: integer }
        last_error: { type: string, nullable: true }

  parameters:
    role_assignment_reason:
      name: reason
      in: query
      schema: { type: string }
      description: Optional revocation reason.

  requestBodies:
    RequestOtp:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              phone_country_code: { type: string, example: "58" }
              phone_number: { type: string, example: "4141234567" }
            required: [phone_country_code, phone_number]

    VerifyOtp:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              phone_country_code: { type: string }
              phone_number: { type: string }
              code: { type: string, example: "123456" }
              first_name: { type: string, description: Required only the first time this phone verifies. }
              last_name: { type: string, description: Required only the first time this phone verifies. }
              device: { $ref: "#/components/schemas/Device" }
            required: [phone_country_code, phone_number, code, device]

    RefreshSession:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              refresh_token: { type: string }
            required: [refresh_token]

  responses:
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Missing or invalid access token, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Not authorized for this action, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict: { description: State conflict (e.g. otp already used/expired/exhausted), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    UnprocessableContent: { description: Validation failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

paths:
  /api/v1/{role}/otp:
    parameters:
      - name: role
        in: path
        required: true
        schema: { type: string, enum: [customer, courier, merchant, admin] }
    post:
      summary: Request an OTP for a phone number
      tags: [customer, courier, merchant, admin]
      requestBody: { $ref: "#/components/requestBodies/RequestOtp" }
      responses:
        "201":
          description: Challenge created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpChallenge" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/{role}/otp/verify:
    parameters:
      - name: role
        in: path
        required: true
        schema: { type: string, enum: [customer, courier, merchant, admin] }
    post:
      summary: Verify an OTP; creates the account on first verification and issues a session
      tags: [customer, courier, merchant, admin]
      requestBody: { $ref: "#/components/requestBodies/VerifyOtp" }
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableContent" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/{role}/session/refresh:
    parameters:
      - name: role
        in: path
        required: true
        schema: { type: string, enum: [customer, courier, merchant, admin] }
    post:
      summary: Rotate a refresh token for a new session
      tags: [customer, courier, merchant, admin]
      requestBody: { $ref: "#/components/requestBodies/RefreshSession" }
      responses:
        "200":
          description: New session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403":
          description: Session expired, device blocked, or refresh token reuse detected (see error.code)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/{role}/session:
    parameters:
      - name: role
        in: path
        required: true
        schema: { type: string, enum: [customer, courier, merchant, admin] }
    delete:
      summary: Log out (revoke the current session)
      tags: [customer, courier, merchant, admin]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/customer/profile:
    get:
      summary: View my profile
      tags: [customer]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: Update my profile
      tags: [customer]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string }
                preferred_language: { type: string }
                timezone: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableContent" }

  /api/v1/admin/roles:
    get:
      summary: List roles
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Role" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create a role
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                code: { type: string }
                description: { type: string }
                scope_type: { type: string, enum: [platform, organization, branch] }
                organization_id: { type: string, format: uuid }
                system_role: { type: boolean }
                active: { type: boolean }
              required: [name, code, scope_type]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableContent" }

  /api/v1/admin/roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Show a role
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Role" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update a role
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Role" } } } }
