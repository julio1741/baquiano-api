x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  environment: &app_env
    RAILS_ENV: development
    DATABASE_HOST: db
    DATABASE_PORT: "5432"
    DATABASE_USERNAME: ${DATABASE_USERNAME:-baquiano}
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:-baquiano}
    DATABASE_NAME: ${DATABASE_NAME:-baquiano_development}
    REDIS_URL: redis://redis:6379/0
    RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
  volumes:
    - .:/rails
    - bundle_cache:/usr/local/bundle
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-baquiano}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-baquiano}
      POSTGRES_DB: ${DATABASE_NAME:-baquiano_development}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-baquiano}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    ports:
      - "3001:3000"
    command: bin/rails server -b 0.0.0.0

  sidekiq:
    <<: *app
    command: bundle exec sidekiq
    ports: []

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
