name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  RAILS_ENV: test
  DATABASE_HOST: localhost
  DATABASE_USERNAME: baquiano
  DATABASE_PASSWORD: baquiano
  TEST_DATABASE_NAME: baquiano_test
  REDIS_URL: redis://localhost:6379/0
  RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
  # CI-only placeholders (ephemeral test run, not a real environment).
  AR_ENCRYPTION_PRIMARY_KEY: ci-primary-key-not-a-real-secret-000000
  AR_ENCRYPTION_DETERMINISTIC_KEY: ci-deterministic-key-not-a-secret-00
  AR_ENCRYPTION_KEY_DERIVATION_SALT: ci-key-derivation-salt-not-a-secret
  BLIND_INDEX_PEPPER: ci-only-pepper-do-not-use-in-production

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Brakeman
        run: bundle exec brakeman -q --no-pager
      - name: bundler-audit
        run: |
          bundle exec bundler-audit check --update

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: baquiano
          POSTGRES_PASSWORD: baquiano
          POSTGRES_DB: baquiano_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U baquiano"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev postgresql-client
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Drop unused postgis extras (see docker/db-init)
        env:
          PGPASSWORD: baquiano
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U baquiano -d baquiano_test <<-SQL
            DROP EXTENSION IF EXISTS postgis_tiger_geocoder CASCADE;
            DROP EXTENSION IF EXISTS postgis_topology CASCADE;
            DROP EXTENSION IF EXISTS fuzzystrmatch CASCADE;
            DROP SCHEMA IF EXISTS tiger CASCADE;
            DROP SCHEMA IF EXISTS tiger_data CASCADE;
            DROP SCHEMA IF EXISTS topology CASCADE;
          SQL
      - name: Prepare database
        run: bin/rails db:prepare
      - name: RSpec
        run: bundle exec rspec
      - name: Validate OpenAPI document
        run: |
          ruby -ryaml -e '
            doc = YAML.load_file("docs/openapi/v1/openapi.yaml")
            %w[openapi info paths].each do |key|
              abort "docs/openapi/v1/openapi.yaml is missing top-level \"#{key}\"" unless doc.key?(key)
            end
            puts "docs/openapi/v1/openapi.yaml: #{doc["paths"].size} path(s) documented"
          '
